name: Daily Housing Check

on:
  schedule:
  
    # Vintertid (CET = UTC+1) → 08:00 svensk tid
    - cron: "0 7 * * *"

  # Möjlighet att köra manuellt
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # krävs för att kunna commit:a result.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Commit result.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add result.json
          git commit -m "Daily update" || echo "Inga ändringar att committa"
          git push || echo "Ingen push (t.ex. körning i fork)"
