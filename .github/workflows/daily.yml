name: Daily Housing Check

on:
  schedule:
    - cron: "0 5 * * *"   # kör 05:00 UTC (07:00 svensk tid vinter)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Commit result.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add result.json
          git commit -m "Daily update" || echo "Inga ändringar"
          git push || echo "Ingen push"
